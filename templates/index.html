<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Power BI Embed Test</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://app.powerbi.com" crossorigin>
  <script src="https://js.monitor.azure.com/scripts/b/ai.3.gbl.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/powerbi-client/dist/powerbi.min.js"></script>
  <style>
    /* Keep the landing view simple while the report is not embedded. */
    .home-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 95vh;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .btn-view {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }
    .btn-view:hover {
      background-color: #005a9e;
    }
    .d-none {
      display: none !important;
    }
    .input-username {
      padding: 10px;
      width: 280px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 15px;
    }
    .portal-login {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      height: 95vh;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
    .portal-login input {
      padding: 10px;
      width: 280px;
      font-size: 14px;
    }
    .error-message {
      color: #b91c1c;
      min-height: 20px;
    }
  </style>
</head>
<body data-embed-url="{{ embed_url }}" data-report-id="{{ report_id }}" data-authenticated="{{ 'true' if portal_authenticated else 'false' }}" data-applicationinsights-connection-string="{{ applicationinsights_connection_string }}">

  <div id="loginPage" class="portal-login {% if portal_authenticated %}d-none{% endif %}">
    <h1>Portal login</h1>
    <input type="password" id="portalPassword" placeholder="Nhập password portal" autocomplete="current-password">
    <button class="btn-view" id="loginButton">Đăng nhập</button>
    <p id="loginError" class="error-message"></p>
  </div>

  <!-- Landing view: choose the RLS username before requesting a token. -->
  <div id="homePage" class="home-container {% if not portal_authenticated %}d-none{% endif %}">
    <h1>Hello Chào bạn 👋</h1>
    <p>Hệ thống thử nghiệm hiệu năng Fabric Embed Report</p>
    <input type="text" id="usernameInput" class="input-username" placeholder="Nhập username để test RLS">
    <button class="btn-view" id="viewReportButton">Xem báo cáo</button>
  </div>

  <!-- The report container stays hidden until the embed token is ready. -->
  <div id="reportPage" class="d-none">
    <div
      id="reportContainer"
      style="
        height:95vh;
        width:100%;
        border:1px solid #ccc;
      ">
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const applicationInsightsConnectionString = document.body.dataset.applicationinsightsConnectionString;
      const appInsights = applicationInsightsConnectionString && window.Microsoft && window.Microsoft.ApplicationInsights
        ? new Microsoft.ApplicationInsights.ApplicationInsights({
            config: {
              connectionString: applicationInsightsConnectionString,
              enableAutoRouteTracking: true
            }
          })
        : null;

      if (appInsights) {
        appInsights.loadAppInsights();
        appInsights.trackPageView();
      }

      function trackPortalEvent(name, properties = {}) {
        if (appInsights) {
          appInsights.trackEvent({ name }, properties);
        }
      }

      // The SDK is deferred, so initialize only after it has loaded.
      const models = window['powerbi-client'].models;

      const config = {
        type: 'report',
        tokenType: models.TokenType.Embed,
        accessToken: '',
        embedUrl: document.body.dataset.embedUrl,
        id: document.body.dataset.reportId,
        permissions: models.Permissions.Read,
        settings: {
          panes: {
            filters: {
              visible: false
            }
          },
          navContentPaneEnabled: false,
          visualRenderedEvents: true
        }
      };

      const reportContainer = document.getElementById('reportContainer');
      let report = null;
      let visualLoadRecorded = false;
      let pageInitializationMs = null;

      function sendPerformanceMetric(name, durationMs) {
        if (!Number.isFinite(durationMs) || durationMs < 0) {
          return;
        }

        const metric = {
          name,
          duration_ms: Number(durationMs.toFixed(2))
        };
        console.info(`[performance] ${name}: ${metric.duration_ms}ms`);

        fetch('/performance-metrics', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(metric),
          keepalive: true
        }).catch(error => console.warn('Không thể gửi performance metric:', error));
      }

      function measurePageInitialization() {
        const navigation = performance.getEntriesByType('navigation')[0];
        if (!navigation) {
          return;
        }

        pageInitializationMs = navigation.domContentLoadedEventEnd - navigation.startTime;
        if (document.body.dataset.authenticated === 'true') {
          sendPerformanceMetric('page_init', pageInitializationMs);
        }
      }

      function bootstrapReport() {
        // Bootstrap starts the report iframe before the embed token arrives.
        powerbi.bootstrap(reportContainer, { type: 'report' });
      }

      async function startEmbedding() {
        const inputUser = document.getElementById('usernameInput').value.trim();
        if (!inputUser) {
          alert('Vui lòng nhập username.');
          return;
        }

        const viewButton = document.getElementById('viewReportButton');
        viewButton.disabled = true;
        const tokenRequestStartedAt = performance.now();

        try {
          const response = await fetch('/get-embed-token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: inputUser })
          });
          const data = await response.json();
          if (!response.ok || !data.token) {
            throw new Error(data.error || 'Server không trả về Embed Token.');
          }

          config.accessToken = data.token;

          if (appInsights) {
            appInsights.setAuthenticatedUserContext(inputUser);
          }
          trackPortalEvent('embed_token_requested', { username: inputUser });

          document.getElementById('homePage').classList.add('d-none');
          document.getElementById('reportPage').classList.remove('d-none');

          // Apply the fresh token to the already bootstrapped report iframe.
          report = powerbi.embed(reportContainer, config);
          const reportStartedAt = performance.now();

          report.on("loaded", function () {
            sendPerformanceMetric('report_loaded', performance.now() - reportStartedAt);
            console.info('Report loaded successfully');
          });

          report.on("rendered", function () {
            sendPerformanceMetric('report_rendered', performance.now() - reportStartedAt);
          });

          report.on("visualRendered", function () {
            if (!visualLoadRecorded) {
              visualLoadRecorded = true;
              sendPerformanceMetric('visual_loaded', performance.now() - reportStartedAt);
            }
          });

          report.on("error", function (event) {
            console.error(event.detail);
          });

        } catch (error) {
          console.error("Lỗi khi lấy Embed Token:", error);
          alert(`Không thể lấy Embed Token từ Server: ${error.message}`);
          viewButton.disabled = false;
        } finally {
          sendPerformanceMetric('token_api', performance.now() - tokenRequestStartedAt);
        }
      }

      document.getElementById('viewReportButton').addEventListener('click', startEmbedding);

      async function loginToPortal() {
        const passwordInput = document.getElementById('portalPassword');
        const loginButton = document.getElementById('loginButton');
        const loginError = document.getElementById('loginError');
        loginButton.disabled = true;
        loginError.textContent = '';
        try {
          const response = await fetch('/portal-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: passwordInput.value })
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Đăng nhập thất bại.');
          }
          document.getElementById('loginPage').classList.add('d-none');
          document.getElementById('homePage').classList.remove('d-none');
          bootstrapReport();
          trackPortalEvent('portal_login_succeeded');
          if (pageInitializationMs !== null) {
            sendPerformanceMetric('page_init', pageInitializationMs);
          }
          passwordInput.value = '';
        } catch (error) {
          loginError.textContent = error.message;
          loginButton.disabled = false;
        }
      }

      document.getElementById('loginButton').addEventListener('click', loginToPortal);
      document.getElementById('portalPassword').addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          loginToPortal();
        }
      });

      if (document.body.dataset.authenticated === 'true') {
        bootstrapReport();
      }

      measurePageInitialization();
    });
  </script>

</body>
</html>
